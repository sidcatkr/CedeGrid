name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native:
    timeout-minutes: 30
    env:
      TMPDIR: ${{ github.workspace }}/.runtime/tmp
      PYTHONDONTWRITEBYTECODE: '1'
      CEDEGRID_TEST_PYTHON: ${{ github.workspace }}/.runtime/test-python/bin/python
      # Use the production observation cadence, also exercised by Docker Linux.
      CEDEGRID_SERVICE_TEST_MONITOR_MS: '500'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: mkdir -p "$TMPDIR"
      - run: python3 -m venv .runtime/test-python
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: rustc +stable --version && python3 --version && uname -a
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable clippy --locked --all-targets -- -D warnings
      - run: cargo +stable test --locked
      - run: PYTHONPATH="$PWD/python" "$CEDEGRID_TEST_PYTHON" -m unittest discover -s tests -p 'test_*.py'
      - run: PYTHONPATH="$PWD/python" "$CEDEGRID_TEST_PYTHON" -m unittest discover -s python/tests -p 'test_*.py'
      - run: cargo +stable run --locked -- --config examples/node.toml doctor
      - run: cargo +stable run --locked -- --config examples/node.toml observe --samples 2 --no-state
  portable-windows:
    timeout-minutes: 30
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable check --locked --all-targets
      - run: cargo +stable test --locked --lib --test policy --test telemetry --test cli
  minimum-rust:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      TMPDIR: ${{ github.workspace }}/.runtime/tmp
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p "$TMPDIR"
      - run: rustup toolchain install 1.88.0 --profile minimal
      - run: cargo +1.88.0 check --locked --all-targets
  sdk:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        node: ['22.14.0', '24', '26']
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ./python
      - run: python -m unittest discover -s python/tests -p 'test_*.py'
      - run: npm ci --ignore-scripts --omit=optional
        working-directory: npm
      - run: npm test
        working-directory: npm
      - run: npm audit --omit=dev --omit=optional
        working-directory: npm
