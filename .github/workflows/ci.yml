name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native:
    timeout-minutes: 30
    env:
      TMPDIR: ${{ github.workspace }}/.runtime/tmp
      PYTHONDONTWRITEBYTECODE: '1'
      RESMGR_TEST_PYTHON: ${{ github.workspace }}/.runtime/test-python/bin/python
      # Use the production observation cadence, also exercised by Docker Linux.
      RESMGR_SERVICE_TEST_MONITOR_MS: '500'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p "$TMPDIR"
      - run: python3 -m venv .runtime/test-python
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: rustc +stable --version && python3 --version && uname -a
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable clippy --locked --all-targets -- -D warnings
      - run: cargo +stable test --locked
      - run: PYTHONPATH="$PWD/python" "$RESMGR_TEST_PYTHON" -m unittest discover -s tests -p 'test_*.py'
      - run: PYTHONPATH="$PWD/python" "$RESMGR_TEST_PYTHON" -m unittest discover -s python/tests -p 'test_*.py'
      - run: cargo +stable run --locked -- --config examples/node.yaml doctor
      - run: cargo +stable run --locked -- --config examples/node.yaml observe --samples 2 --no-state
  portable-windows:
    timeout-minutes: 30
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable check --locked --all-targets
      - run: cargo +stable test --locked --lib --test policy --test telemetry --test cli
  minimum-rust:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      TMPDIR: ${{ github.workspace }}/.runtime/tmp
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p "$TMPDIR"
      - run: rustup toolchain install 1.88.0 --profile minimal
      - run: cargo +1.88.0 check --locked --all-targets
