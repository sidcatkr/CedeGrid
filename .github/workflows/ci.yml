name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native:
    timeout-minutes: 30
    env:
      TMPDIR: ${{ github.workspace }}/.runtime/tmp
      PYTHONDONTWRITEBYTECODE: '1'
      CEDEGRID_TEST_PYTHON: ${{ github.workspace }}/.runtime/test-python/bin/python
      # Use the production observation cadence, also exercised by Docker Linux.
      CEDEGRID_SERVICE_TEST_MONITOR_MS: '500'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: mkdir -p "$TMPDIR"
      - run: python3 -m venv .runtime/test-python
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: rustc +stable --version && python3 --version && uname -a
      # The SDK's TLS tests make their certificates with the openssl on PATH; record which one
      # and the test Python's own TLS library.
      - run: which -a openssl; openssl version; .runtime/test-python/bin/python -c 'import ssl,sys; print(sys.version); print(ssl.OPENSSL_VERSION)'
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable clippy --locked --all-targets -- -D warnings
      - run: cargo +stable test --locked -- --test-threads=1
      - run: PYTHONPATH="$PWD/python" "$CEDEGRID_TEST_PYTHON" -m unittest discover -s tests -p 'test_*.py'
      - run: PYTHONPATH="$PWD/python" "$CEDEGRID_TEST_PYTHON" -m unittest discover -s python/tests -p 'test_*.py'
      - run: cargo +stable run --locked -- --config examples/node.toml doctor
      - run: cargo +stable run --locked -- --config examples/node.toml observe --samples 2 --no-state
  portable-windows:
    timeout-minutes: 30
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable check --locked --all-targets
      - run: cargo +stable test --locked --lib --test policy --test telemetry --test cli
  system-mode:
    # Feature 005: the System mode fixtures as root under systemd 249 in a container, with the
    # two packages installed and purged through dpkg.
    timeout-minutes: 45
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cedegrid-system-mode tools/docker-validation/system-mode
      - run: >-
          docker run -d --name cedegrid-sm --privileged --cgroupns=private
          --tmpfs /run --tmpfs /run/lock --tmpfs /tmp -v "$PWD":/src:ro cedegrid-system-mode
      - run: docker exec cedegrid-sm timeout 120 systemctl is-system-running --wait || true
      - run: docker exec -e CEDEGRID_TEST_RELEASE=1 cedegrid-sm /src/tools/docker-validation/system-mode/run.sh
  minimum-rust:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      TMPDIR: ${{ github.workspace }}/.runtime/tmp
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p "$TMPDIR"
      - run: rustup toolchain install 1.88.0 --profile minimal
      - run: cargo +1.88.0 check --locked --all-targets
  sdk:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        node: ['22.14.0', '24', '26']
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ./python
      - run: python -m unittest discover -s python/tests -p 'test_*.py'
      - run: npm ci --ignore-scripts --omit=optional
        working-directory: npm
      - run: npm test
        working-directory: npm
      - run: npm audit --omit=dev --omit=optional
        working-directory: npm
