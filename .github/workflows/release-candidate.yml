name: Build or accept an immutable CedeGrid candidate
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Build unqualified packages, or accept a previously qualified bundle
        required: true
        default: build
        type: choice
        options: [build, accept-qualified]
permissions:
  contents: read
env:
  RUSTUP_TOOLCHAIN: '1.98.1'
concurrency:
  group: cedegrid-candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    if: inputs.operation == 'build'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-22.04, target: linux-x64-gnu}
          - {runner: ubuntu-22.04-arm, target: linux-arm64-gnu}
          - {runner: macos-15-intel, target: darwin-x64}
          - {runner: macos-14, target: darwin-arm64}
          - {runner: windows-2025, target: win32-x64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: rustup toolchain install 1.98.1 --profile minimal
      - run: cargo fetch --locked
      - name: Build final native bytes; runtime baseline remains unqualified
        run: python tools/build_native.py --target ${{ matrix.target }} --out native/${{ matrix.target }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.target }}
          path: |
            native/${{ matrix.target }}/cedegrid*
            native/${{ matrix.target }}/native-build.json
          if-no-files-found: error
          retention-days: 30
  packages:
    if: inputs.operation == 'build'
    needs: native
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.7
      - run: rustup toolchain install 1.98.1 --profile minimal
      - run: cargo fetch --locked
      - run: npm ci --ignore-scripts --omit=optional
        working-directory: npm
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: native-*
          path: native
      - name: Package once from the exact native inputs
        shell: bash
        run: |
          python tools/build_packages.py --out candidate --python python3.12 \
            --binary linux-x64-gnu=native/native-linux-x64-gnu/cedegrid \
            --binary linux-arm64-gnu=native/native-linux-arm64-gnu/cedegrid \
            --binary darwin-x64=native/native-darwin-x64/cedegrid \
            --binary darwin-arm64=native/native-darwin-arm64/cedegrid \
            --binary win32-x64=native/native-win32-x64/cedegrid.exe
          python tools/pack_source_review.py --source "$GITHUB_WORKSPACE" --output "$GITHUB_WORKSPACE/source-export" --public-candidate
          python - <<'PY'
          import json,shutil,sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          from build_packages import scan_archive,digest
          root=Path('candidate')
          destination=root/'source/cedegrid-0.2.0-source.tar.gz'
          destination.parent.mkdir()
          shutil.copyfile('source-export/cedegrid-source.tar.gz',destination)
          path=root/'manifest.json'
          manifest=json.loads(path.read_text())
          manifest['artifacts'].append({'path':destination.relative_to(root).as_posix(),'sha256':digest(destination),'size':destination.stat().st_size,'scan':scan_archive(destination)})
          path.write_text(json.dumps(manifest,indent=2)+'\n')
          PY
          cp docs/release-0.2-gates.json candidate/gates.json
          python tools/release_manifest.py --packages candidate --gates candidate/gates.json --freeze
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cedegrid-unqualified-0.2.0
          path: candidate/
          if-no-files-found: error
          retention-days: 30
  accept-qualified:
    if: inputs.operation == 'accept-qualified'
    # This protected runner holds the bundle after the required OS, physical
    # host, GPU, package and fault checks have run against its original bytes.
    runs-on: [self-hosted, cedegrid-release-qualification]
    environment: cedegrid-qualification
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Copy only verified public files from the prepared bundle
        env:
          QUALIFIED_CANDIDATE_DIRECTORY: ${{ vars.QUALIFIED_CANDIDATE_DIRECTORY }}
        run: |
          python3 - <<'PY'
          import json,os,shutil,sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          from release_manifest import member,validate
          root=Path(os.environ['QUALIFIED_CANDIDATE_DIRECTORY']).resolve(strict=True)
          assert root.is_absolute()
          gates=json.loads(member(root,'gates.json').read_text())
          validate(root,gates,require_stable=True)
          manifest=json.loads(member(root,'manifest.json').read_text())
          names={a['path'] for a in manifest['artifacts']}
          names.update({'manifest.json','source-snapshot.json','gates.json','SHA256SUMS'})
          for gate in gates['required_gates']:
              names.update(item['path'] for item in gate['evidence'])
          destination=Path('candidate')
          destination.mkdir(exist_ok=False)
          for name in sorted(names):
              target=destination/name
              target.parent.mkdir(parents=True,exist_ok=True)
              shutil.copyfile(member(root,name),target)
          validate(destination,gates,require_stable=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cedegrid-qualified-0.2.0
          path: candidate/
          if-no-files-found: error
          retention-days: 90
