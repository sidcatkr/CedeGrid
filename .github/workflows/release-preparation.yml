name: release preparation snapshot
on:
  push:
    branches: ['release/0.2.0-preparation-20260908']
    paths: ['.github/workflows/release-preparation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-snapshot:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive only tracked source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p capture
          git archive --format=tar.gz --prefix=source/ "$GITHUB_SHA" > capture/source.tar.gz
          printf '%s\n' "$GITHUB_SHA" > capture/source-commit.txt
          (cd capture && sha256sum source.tar.gz source-commit.txt > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: preparation-source-${{ github.sha }}
          path: capture/
          if-no-files-found: error
          retention-days: 7
  offline-build-inputs:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      CARGO_HOME: /tmp/cedegrid-cargo
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Fetch public dependency inputs only
        shell: bash
        run: |
          set -euo pipefail
          cargo fetch --locked
          mkdir -p /tmp/cedegrid-seed/src /tmp/cedegrid-inputs/{python,node,rust}
          printf '[package]\nname="cedegrid-dependency-seed"\nversion="0.0.0"\nedition="2021"\n[dependencies]\ntoml="=0.8.23"\nhmac="=0.12.1"\nbase64="=0.22.1"\n' > /tmp/cedegrid-seed/Cargo.toml
          printf 'fn main() {}\n' > /tmp/cedegrid-seed/src/main.rs
          cargo fetch --manifest-path /tmp/cedegrid-seed/Cargo.toml
          cp -a /tmp/cedegrid-seed /tmp/cedegrid-inputs/rust/seed
          cp -a "$CARGO_HOME/registry" /tmp/cedegrid-inputs/rust/registry
          cp -a "$HOME/.rustup/toolchains/1.88.0-x86_64-unknown-linux-gnu" /tmp/cedegrid-inputs/rust/toolchain
          cd /tmp/cedegrid-inputs/node
          npm init -y
          npm install --ignore-scripts --save-exact lossless-json@4.3.0 smol-toml@1.4.2 typescript@5.8.3 @types/node@22.14.0
          cd /tmp/cedegrid-inputs
          python -m pip download --dest python build==1.2.2.post1 setuptools==77.0.3 wheel==0.45.1 tomli==2.2.1 tomli-w==1.2.0 pytest==8.3.5
          printf '%s\n' "$GITHUB_SHA" > source-commit.txt
          rustc --version > rust-version.txt
          node --version > node-version.txt
          npm --version > npm-version.txt
          tar -czf /tmp/cedegrid-build-inputs.tar.gz rust node python source-commit.txt rust-version.txt node-version.txt npm-version.txt
          sha256sum /tmp/cedegrid-build-inputs.tar.gz > /tmp/cedegrid-build-inputs.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: preparation-build-inputs-${{ github.sha }}
          path: |
            /tmp/cedegrid-build-inputs.tar.gz
            /tmp/cedegrid-build-inputs.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
