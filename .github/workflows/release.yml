name: Publish previously qualified CedeGrid artifacts
on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful run containing the immutable cedegrid-qualified-0.2.0 artifact
        required: true
        type: string
      publish:
        description: Upload the exact qualified files after verification
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: cedegrid-release-0.2.0
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-22.04
    environment: cedegrid-release
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.0'
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.16.0 --ignore-scripts
      - name: Verify pinned OIDC tool versions
        run: |
          test "$(node --version)" = 'v24.14.0'
          test "$(npm --version)" = '11.16.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify candidate run belongs to this exact repository revision
        id: provenance
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          python - <<'PY'
          import json,os,subprocess
          run=os.environ['CANDIDATE_RUN_ID']
          assert run.isdecimal(), 'candidate run must be numeric'
          data=json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+run]))
          assert data['head_sha']==os.environ['GITHUB_SHA'] and data['conclusion']=='success' and data['status']=='completed'
          assert data['path']=='.github/workflows/release-candidate.yml' and data['event']=='workflow_dispatch'
          assert data['repository']['full_name']==data['head_repository']['full_name']==os.environ['GITHUB_REPOSITORY']
          listing=json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+run+'/artifacts?per_page=100']))
          assert listing['total_count']<=100
          matches=[item for item in listing['artifacts'] if item['name']=='cedegrid-qualified-0.2.0']
          assert len(matches)==1 and not matches[0]['expired'], 'one immutable qualified artifact required'
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('artifact_id='+str(matches[0]['id'])+'\n')
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ steps.provenance.outputs.artifact_id }}
          merge-multiple: true
          path: candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Verify all gates, source, and artifact hashes
        run: |
          python tools/release_manifest.py --packages candidate --gates candidate/gates.json --require-stable
          python - <<'PY'
          import json,os
          from pathlib import Path
          snapshot=json.loads(Path('candidate/source-snapshot.json').read_text())
          assert snapshot['source_commit']==os.environ['GITHUB_SHA']
          PY
      - name: Attest the exact qualified artifacts before registry publication
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        if: inputs.publish
        with:
          subject-path: |
            candidate/npm/*.tgz
            candidate/pypi/*
            candidate/standalone/*
            candidate/source/*.tar.gz
      - name: Publish native npm packages first
        if: inputs.publish
        run: python tools/publish_packages.py --packages candidate --gates candidate/gates.json --phase native --apply
      - name: Stage only original Python files that are not already published
        if: inputs.publish
        run: python tools/publish_packages.py --packages candidate --gates candidate/gates.json --phase python-stage --python-stage python-publish
      - name: Detect pending Python uploads
        if: inputs.publish
        id: python
        run: |
          if [ -d python-publish ]; then
            echo 'pending=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Publish original wheel and sdist through PyPI trusted publishing
        if: inputs.publish && steps.python.outputs.pending == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: python-publish
          attestations: true
      - name: Publish main npm package after verifying all prerequisite file hashes
        if: inputs.publish
        run: python tools/publish_packages.py --packages candidate --gates candidate/gates.json --phase main --apply
      - name: Publish GitHub Release with unchanged qualified files
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          root=Path('candidate')
          manifest=json.loads((root/'manifest.json').read_text())
          artifacts=[str(root/a['path']) for a in manifest['artifacts']]
          tag='v0.2.0'
          old=subprocess.run(['gh','release','view',tag,'--json','tagName'],capture_output=True)
          if old.returncode==0:
              raise SystemExit('Release already exists; compare its asset hashes before an explicit retry. No assets are overwritten.')
          subprocess.run(['gh','release','create',tag,'--target',os.environ['GITHUB_SHA'],'--title','CedeGrid 0.2.0','--notes-file','docs/release.md',*artifacts,str(root/'SHA256SUMS')],check=True)
          PY
