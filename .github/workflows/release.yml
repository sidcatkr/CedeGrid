name: Publish previously qualified CedeGrid release files
# The release is files on GitHub Releases only (003 FR-073): nothing goes to npm or PyPI. The
# version is Cargo.toml's, read by tools/release_version.py.
on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful run containing the immutable cedegrid-qualified-VERSION artifact
        required: true
        type: string
      publish:
        description: Upload the exact qualified files to a GitHub Release after verification
        required: true
        default: false
        type: boolean
      publish_crate:
        description: After the GitHub Release, publish this commit's crate to crates.io (needs the CARGO_REGISTRY_TOKEN secret)
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: cedegrid-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-22.04
    environment: cedegrid-release
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Read the release version from Cargo.toml
        id: version
        run: echo "version=$(python tools/release_version.py --check)" >> "$GITHUB_OUTPUT"
      - name: Verify candidate run belongs to this exact repository revision
        id: provenance
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PY'
          import json,os,subprocess
          run=os.environ['CANDIDATE_RUN_ID']
          assert run.isdecimal(), 'candidate run must be numeric'
          data=json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+run]))
          assert data['head_sha']==os.environ['GITHUB_SHA'] and data['conclusion']=='success' and data['status']=='completed'
          assert data['path']=='.github/workflows/release-candidate.yml' and data['event']=='workflow_dispatch'
          assert data['repository']['full_name']==data['head_repository']['full_name']==os.environ['GITHUB_REPOSITORY']
          listing=json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+run+'/artifacts?per_page=100']))
          assert listing['total_count']<=100
          matches=[item for item in listing['artifacts'] if item['name']=='cedegrid-qualified-'+os.environ['RELEASE_VERSION']]
          assert len(matches)==1 and not matches[0]['expired'], 'one immutable qualified artifact required'
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('artifact_id='+str(matches[0]['id'])+'\n')
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ steps.provenance.outputs.artifact_id }}
          merge-multiple: true
          path: candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Verify all gates, source, and artifact hashes
        run: |
          python tools/release_manifest.py --packages candidate --gates candidate/gates.json --require-stable
          python - <<'PY'
          import json,os
          from pathlib import Path
          snapshot=json.loads(Path('candidate/source-snapshot.json').read_text())
          assert snapshot['source_commit']==os.environ['GITHUB_SHA']
          PY
      - name: Attest the exact qualified files before publication
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        if: inputs.publish
        with:
          subject-path: |
            candidate/install/install.sh
            candidate/homebrew/cedegrid.rb
            candidate/standalone/*
            candidate/deb/*.deb
            candidate/npm/*.tgz
            candidate/pypi/*
            candidate/source/*.tar.gz
      - name: Publish GitHub Release with unchanged qualified files
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PY'
          import json,os,subprocess,sys
          from pathlib import Path
          sys.path.insert(0,'tools')
          from release_manifest import checksums
          root=Path('candidate')
          manifest=json.loads((root/'manifest.json').read_text())
          version=os.environ['RELEASE_VERSION']
          assert manifest['version']==version, 'candidate version differs from Cargo.toml'
          # Each file is published under its base name, which SHA256SUMS already uses.
          assert (root/'SHA256SUMS').read_text()==checksums(manifest['artifacts'])
          artifacts=[str(root/a['path']) for a in manifest['artifacts']]
          tag='v'+version
          old=subprocess.run(['gh','release','view',tag,'--json','tagName'],capture_output=True)
          if old.returncode==0:
              raise SystemExit('Release already exists; compare its asset hashes before an explicit retry. No assets are overwritten.')
          subprocess.run(['gh','release','create',tag,'--target',os.environ['GITHUB_SHA'],'--title','CedeGrid '+version,'--notes-file','docs/release.md',*artifacts,str(root/'SHA256SUMS')],check=True)
          PY
      # The second channel for `cargo install --locked cedegrid` (003 T107). It packages this
      # verified commit's source; the release files above are untouched.
      - name: Publish the crate to crates.io
        if: inputs.publish && inputs.publish_crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          test -n "$CARGO_REGISTRY_TOKEN" || { echo 'CARGO_REGISTRY_TOKEN is not set for the release environment' >&2; exit 1; }
          rustup toolchain install 1.98.1 --profile minimal
          cargo +1.98.1 publish --locked
  # The tap behind `brew install sidcatkr/cedegrid/cedegrid` (003 T107). It is a job of its own,
  # so a failed tap update can be re-run without touching the release.
  homebrew-tap:
    needs: release
    if: inputs.publish
    runs-on: ubuntu-22.04
    environment: cedegrid-release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Read the release version from Cargo.toml
        id: version
        run: echo "version=$(python tools/release_version.py --check)" >> "$GITHUB_OUTPUT"
      - name: Write the release's formula into the tap
        env:
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          test -n "$HOMEBREW_TAP_TOKEN" || { echo 'HOMEBREW_TAP_TOKEN is not set for the release environment' >&2; exit 1; }
          gh release download "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --pattern cedegrid.rb --pattern SHA256SUMS --dir release
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$HOMEBREW_TAP_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c http.extraheader="$auth" clone https://github.com/sidcatkr/homebrew-cedegrid.git tap
          python tools/update_homebrew_tap.py --release release --tap tap --version "$RELEASE_VERSION"
          cd tap
          git add Formula/cedegrid.rb README.md
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -q -m "cedegrid $RELEASE_VERSION"
          git -c http.extraheader="$auth" push origin HEAD:main
