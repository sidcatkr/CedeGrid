[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "cedegrid"
version = "0.2.0"
description = "Authenticated CedeGrid client and cooperative worker lifecycle"
requires-python = ">=3.10"
readme = "README.md"
dependencies = ["tomli>=2.2.1,<3; python_version < '3.11'"]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]

[project.urls]
Homepage = "https://github.com/sidcatkr/CedeGrid"
Repository = "https://github.com/sidcatkr/CedeGrid"
Issues = "https://github.com/sidcatkr/CedeGrid/issues"

[tool.setuptools]
packages = ["cedegrid"]
